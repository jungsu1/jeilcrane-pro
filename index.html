<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="robots" content="noindex,nofollow" />
  <title>모두의장부</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;background:#0f172a;color:#f8fafc}
    body{min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:min(520px,100%);background:#111827;border:1px solid #334155;border-radius:24px;padding:32px 26px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.35)}
    .badge{display:inline-block;padding:7px 11px;border-radius:999px;background:#1e293b;color:#93c5fd;font-size:13px;font-weight:700;margin-bottom:18px}
    h1{margin:0 0 10px;font-size:30px;letter-spacing:-.04em}
    p{margin:0;color:#cbd5e1;line-height:1.7}
    .main{font-size:18px;color:#f8fafc;font-weight:700;margin-bottom:10px}
    .note{margin-top:18px;font-size:14px;color:#94a3b8}
  </style>
</head>
<body>
  <main class="card" role="main">
    <div class="badge">PWA 베타 서비스 종료</div>
    <h1>모두의장부</h1>
    <p class="main">기존 PWA 베타 서비스가 종료되었습니다.</p>
    <p>테스트 사용자는 정식 Android 앱으로 이동되었습니다.<br />앞으로 모두의장부는 정식 앱에서 이용해주세요.</p>
    <p class="note">기존 웹 장부는 더 이상 신규 사용을 지원하지 않습니다.</p>
  </main>
</body>
</html>
